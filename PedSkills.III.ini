; PedSkills III - port of JuniorDjjr's PedSkills (GTA San Andreas) to GTA III 1.0
; https://github.com/JuniorDjjr/PedSkills
;
; Put this file next to PedSkills.III.asi. Missing keys keep the game's behaviour.
;
; How accuracy works in GTA III: 0-100, where 100 never misses. Each point below 100
; widens the random spread of a shot. The game's own values: cops 60, SWAT 68, FBI 76,
; army 84, every other ped 60, the player 100. Values above 100 are clamped to 100
; (the unmodded game would treat 120 like 80).

[General]
; Multiplies NPC accuracy before the penalties below (1.0 = game default).
; 1.5 turns a 60 cop into 90 against a still target nearby.
AccuracyMult = 1.0

; Multiplies the player's accuracy (1.0 = game default). Only matters when you
; shoot at an auto-aimed target. Below 1.0 = you miss more.
PlayerAccuracyMult = 1.0

; Accuracy lost when the target moves across the shooter's view, like strafing or
; driving past: about 15 points at 30 degrees per second, at most 40.
; 1.0 = default, 0 = off, 2.0 = twice as much.
AccuracyVelocityFactor = 0.5

; Accuracy lost with distance: 0 up to 3 m, about 8 points at 10 m, 13 at 20 m,
; 16 at 30 m. Misses already grow with distance on their own, so keep this low.
; 1.0 = default, 0 = off.
AccuracyDistanceFactor = 0.3

; Accuracy lost while the shooter is in a vehicle: 15 points times this.
AccuracyOnVehicleFactor = 1.0

; 1 = an NPC facing its target always aims at it. In the unmodded game, when the
; ped's arm hasn't locked onto the target yet, the shot goes straight out of the
; hand and often misses no matter the accuracy. 0 = game default.
AlwaysAimAtTarget = 1

; With AlwaysAimAtTarget: how far off to the side (in degrees) the target may be
; from where the NPC faces.
MaxAimAngle = 60

; Multiplies every weapon's range from weapon.dat (1.0 = unchanged). Affects the
; player too. NPCs shoot once you're within range and, when farther, run in to a
; third of it first (pistol: 30 m range, so cops close in to 10 m). 1.5 = cops
; shoot from 45 m and stop at 15 m. NPC accuracy is adjusted so a longer range
; doesn't make them more accurate.
WeaponRangeMult = 1.5

; 1 = write PedSkills.III.log next to the .asi with the accuracy of NPC shots
; (at most 4 lines per second). For checking that the mod works.
DebugLog = 0

[Default skills]
; Accuracy each ped type spawns with (-1 = game default, shown in brackets).
WeaponAccuracy = 75        ; every non-cop ped (60)
CopsWeaponAccuracy = 85    ; street cops (60)
SwatWeaponAccuracy = 88    ; SWAT (68)
FBIWeaponAccuracy = 91     ; FBI (76)
ArmyWeaponAccuracy = 94    ; army (84)

; Armour each cop type spawns with (-1 = game default, shown in brackets).
CopsArmour = 90            ; (0)
SwatArmour = -1            ; (50)
FBIArmour = -1             ; (100)
ArmyArmour = -1            ; (100)

; Multiplies the accuracy that mission scripts give their peds (1.0 = unchanged).
ScriptAccuracyMult = 1.0
